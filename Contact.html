<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Recipe Finder with questions, recipe suggestions, or website feedback.">
    <meta name="keywords" content="contact Recipe Finder, recipe feedback, website support">
    <meta name="author" content="Landen Dale">
    <title>Recipe Finder | Contact</title>
    <link rel="stylesheet" href="rec.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html">
            <img src="images/logo.svg" alt="Recipe Finder logo">
            <span>Recipe Finder</span>
        </a>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="Recipes.html">Recipes</a>
            <a href="About.html">About</a>
            <a class="active" href="Contact.html">Contact</a>
            <a href="Support.html">Support</a>
        </nav>
    </header>

    <main>
        <section class="page-heading">
            <p class="eyebrow">Get in touch</p>
            <h1>Contact Recipe Finder</h1>
            <p>Send a question, suggestion, or recipe idea using the form below.</p>
        </section>

        <section class="panel">
            <form id="contactForm">
                <label for="contactName">Name</label>
                <input id="contactName" name="contactName" type="text" required maxlength="60">

                <label for="contactEmail">Email</label>
                <input id="contactEmail" name="contactEmail" type="email" required maxlength="100">

                <label for="contactTopic">Topic</label>
                <select id="contactTopic" name="contactTopic" required>
                    <option value="">Choose a topic</option>
                    <option value="recipe">Recipe suggestion</option>
                    <option value="technical">Technical problem</option>
                    <option value="feedback">Website feedback</option>
                </select>

                <label for="contactMessage">Message</label>
                <textarea id="contactMessage" name="contactMessage" required maxlength="1000"></textarea>

                <button type="submit">Send Message</button>
                <p id="contactStatus" class="form-message" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Landen Dale. Educational project.</p>
        <div>
            <a href="https://validator.w3.org/" target="_blank" rel="noopener">Validate HTML</a>
            <a href="https://jigsaw.w3.org/css-validator/" target="_blank" rel="noopener">Validate CSS</a>
        </div>
    </footer>

    <script src="rec.js"></script>
</body>
</html>
